name: AVL binding pilot
on:
  pull_request:
    paths:
      - 'antlab/semantic_binding*.py'
      - 'antlab/tests/test_semantic_binding*.py'
      - 'docs/AVL_BINDING_PILOT_PROTOCOL.md'
      - '.github/workflows/semantic-binding-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Binding regression
        run: python -m unittest antlab.tests.test_semantic_binding_data antlab.tests.test_semantic_binding_pilot
      - name: Full AVL regression
        run: python -m unittest discover -s antlab/tests
      - name: Run declared pilot
        run: python -m antlab.semantic_binding_pilot --output binding-pilot-output
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avl-binding-pilot
          path: binding-pilot-output/
          retention-days: 30
          if-no-files-found: warn
