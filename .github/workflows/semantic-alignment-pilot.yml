name: AVL alignment pilot
on:
  pull_request:
    paths:
      - 'antlab/semantic_alignment_pilot.py'
      - 'antlab/tests/test_semantic_alignment_pilot.py'
      - 'docs/AVL_ALIGNMENT_PILOT_PROTOCOL.md'
      - '.github/workflows/semantic-alignment-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed CPU runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Alignment tests
        run: python -m unittest antlab.tests.test_semantic_alignment_pilot
      - name: Full regression
        run: python -m unittest discover -s antlab/tests
      - name: Reproduce frozen binding checkpoints
        run: python -m antlab.semantic_binding_pilot --output binding-reproduction
      - name: Run declared calibration
        run: python -m antlab.semantic_alignment_pilot --study binding-reproduction --output alignment-output
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avl-alignment-pilot
          path: |
            binding-reproduction/
            alignment-output/
          retention-days: 30
          if-no-files-found: warn
